# 架构文件——口径权威源，工具不写死列名/取值，从这里读
# 格式：数据集 → 列 → 语义信息（人写人改，Agent 只读）

orders:
  file: data/orders.csv
  desc: 某电商订单表（mock，用于联调）
  columns:
    order_id:
      desc: 订单号，主键
    user_id:
      desc: 用户ID
    status:
      desc: 订单状态
      valid_values: [completed, cancelled, pending, refunded]
      # 口径说明：completed=已完结订单（不含退款），退款单单独成类
    amount:
      desc: 订单金额（元），含税
    category:
      desc: 商品类目
      valid_values: [数码, 家居, 服饰, 食品]
    created_at:
      desc: 下单时间（ISO格式）
