# 数据字典（口径权威源）

orders:
  file: data/orders.csv
  desc: 某电商订单表（mock，用于联调）
  columns:
    order_id:
      desc: 订单号，主键
    user_id:
      desc: 用户ID
    status:
      desc: 订单状态
      valid_values:
      - completed
      - cancelled
      - pending
      - refunded
    amount:
      desc: 订单金额（元），含税
    category:
      desc: 商品类目
      valid_values:
      - 数码
      - 家居
      - 服饰
      - 食品
    created_at:
      desc: 下单时间（ISO格式）
  _dict_file: dictionary.yaml
dash_orders:
  file: data/dash_orders.csv
  desc: 大屏问数 mock 宽表（订单粒度，带省份/日期维度）
  columns:
    order_id:
      desc: 订单号，主键，不可作分组/过滤维度
    province:
      desc: 收货省份
      valid_values:
      - 广东
      - 浙江
      - 江苏
      - 上海
      - 北京
      - 四川
      - 湖北
      - 福建
      - 山东
      - 河南
      - 湖南
      - 安徽
    category:
      desc: 商品类目
      valid_values:
      - 数码
      - 家居
      - 服饰
      - 食品
    amount:
      desc: 订单金额（元）
    order_date:
      desc: 下单日期（YYYY-MM-DD），近60天
  _dict_file: dictionary_dash.yaml
ml_orders:
  file: data/ml_orders.csv
  desc: 退款预测 mock 数据集（埋了已知规律：金额>500增险、数码最高、家居最低）
  target: refunded
  task: classification
  columns:
    order_id:
      desc: 订单号，主键，不可作特征
    amount:
      desc: 订单金额（元）
    category:
      desc: 商品类目
      valid_values:
      - 数码
      - 家居
      - 服饰
      - 食品
    user_orders_30d:
      desc: 该用户近30天订单数
    discount_rate:
      desc: 折扣率 0~0.3
    refunded:
      desc: 是否退款（目标列，0/1）。任何情况下不得进入特征矩阵
    created_at:
      desc: 下单时间（ISO格式）
  _dict_file: dictionary_ml.yaml
